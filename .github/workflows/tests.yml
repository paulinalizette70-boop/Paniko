name: Pruebas Paniko
on:
  push:
    branches: [main, feat/paniko-0.8.1-calendario-rendimientos, feat/paniko-0.8.2-masa-madre-inventario, feat/paniko-0.8.3-masa-madre-leche, feat/paniko-masa-madre-visual, feat/paniko-productos-desde-receta-y-subpreparaciones]
  pull_request:
    branches: [main, integracion/paniko-acumulado-visual-20261113, feat/finanzas-costos-productos-0.7.4, feat/paniko-0.8.0-finanzas-masa-madre, feat/paniko-0.8.3-masa-madre-leche, feat/paniko-brioche-formatos-compartidos]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_ci_only
          MYSQL_DATABASE: paniko_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p'test_ci_only'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test_ci_only
      DB_NAME: paniko_test
      MYSQL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Crear esquema de prueba MySQL
        run: npm run db:init
      - name: Ejecutar pruebas unitarias e integración MySQL
        run: npm test
